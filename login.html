<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&family=Playfair+Display:ital,wght@0,500;1,500&family=Poppins:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Welcome back</title>
</head>

<body class="login">
  <main class="login-card">
    <h1>Welcome back</h1>
    <p class="lead">just the two of us</p>
    <form id="f"><input id="em" type="email" placeholder="Email" autocomplete="username" required><input id="pw"
        type="password" placeholder="Password" autocomplete="current-password" required><button class="btn" id="go">Log
        in</button></form>
    <p class="err" id="err" role="alert"></p>
  </main>
  <script type="module">
    import { sb, hearts } from './js/app.js';
    hearts(12);
    const err = document.getElementById('err');
    if (new URLSearchParams(location.search).has('denied')) err.textContent = 'This account is not on the guest list.';
    const { data: { session } } = await sb.auth.getSession();
    if (session) location.replace('index.html');
    document.getElementById('f').onsubmit = async e => {
      e.preventDefault(); const b = document.getElementById('go'); b.disabled = true; err.textContent = '';
      const { error } = await sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
      if (error) { err.textContent = 'Wrong email or password. Check them and try again.'; b.disabled = false; return }
      location.replace('index.html');
    };
  </script>
</body>

</html>
