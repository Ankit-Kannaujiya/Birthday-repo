<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&family=Playfair+Display:ital,wght@0,500;1,500&family=Poppins:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Our gallery</title>
</head>

<body class="hidden">
  <main>
    <header class="gal-head">
      <h1>Our gallery</h1>
      <p class="muted">Every moment we kept.</p>
    </header>
    <div class="chips" id="chips"></div>
    <div class="masonry" id="grid"></div>
    <section class="glass up" aria-label="Add photos">
      <div class="drop" id="drop" tabindex="0">Drop photos here or tap to choose (jpg, png, webp, up to 10 MB each)
      </div>
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
      <input id="cap" placeholder="Caption (optional)" maxlength="120"><input id="dt" type="date"><select
        id="cat"></select>
      <div class="bar" id="bar"><i></i></div>
    </section>
  </main>
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="x" id="x" aria-label="Close">✕</button><button class="pv" id="pv"
      aria-label="Previous">‹</button><button class="nx" id="nx" aria-label="Next">›</button>
    <img id="im" alt="">
    <p><span id="lc"></span><small id="ld"></small></p><button class="dl" id="dl" hidden>Delete photo</button>
  </div>
  <script type="module">
    import {sb, guard, renderNav, toast, esc, CONFIG as C} from './js/app.js';
    const me = await guard();
    if (me) {
      renderNav('gallery');
      const $ = id => document.getElementById(id);
      const FB = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="100%" height="100%" fill="#ffd9e2"/><text x="50%" y="58%" font-size="64" text-anchor="middle">💖</text></svg>');
      let items = [], view = [], idx = 0, cat = 'All';
      $('cat').innerHTML = C.CATEGORIES.map(c => '<option>' + esc(c) + '</option>').join('');
      $('chips').innerHTML = ['All', ...C.CATEGORIES].map(c => '<button data-c="' + esc(c) + '"' + (c === 'All' ? ' class="on"' : '') + '>' + esc(c) + '</button>').join('');
      $('chips').onclick = e => {const b = e.target.closest('button'); if (!b) return; cat = b.dataset.c;[...$('chips').children].forEach(x => x.classList.toggle('on', x === b)); render()};
      const fmt = d => d ? new Date(d + 'T00:00:00').toLocaleDateString(undefined, {day: 'numeric', month: 'long', year: 'numeric'}) : '';

      async function load() {
        const {data, error} = await sb.from('photos').select('*').order('taken_on', {ascending: false, nullsFirst: false});
        if (error) toast('Could not load photos: ' + error.message);
        const rows = data || []; let urls = [];
        if (rows.length) {const r = await sb.storage.from('photos').createSignedUrls(rows.map(p => p.path), 3600); urls = r.data || []}
        const mine = rows.map((p, i) => ({...p, src: urls[i]?.signedUrl, own: p.created_by === me.user.id}));
        const samples = C.SAMPLES.map(s => ({src: 'assets/images/sample/' + s.file, caption: s.caption, taken_on: s.date, category: s.category}));
        items = [...mine, ...samples].sort((a, b) => (b.taken_on || '').localeCompare(a.taken_on || ''));
        render();
      }
      function render() {
        view = items.filter(p => cat === 'All' || p.category === cat);
        $('grid').innerHTML = view.map((p, i) => '<figure class="ph" data-i="' + i + '" tabindex="0"><img loading="lazy" src="' + esc(p.src) + '" alt="' + esc(p.caption) + '"><figcaption>' + esc(p.caption) + '</figcaption></figure>').join('') || '<p class="muted">No photos here yet. Add one below.</p>';
        $('grid').querySelectorAll('img').forEach(im => im.onerror = () => {im.onerror = null; im.src = FB});
      }
      $('grid').onclick = e => {const f = e.target.closest('.ph'); if (f) show(+f.dataset.i)};
      $('grid').onkeydown = e => {if (e.key === 'Enter') {const f = e.target.closest('.ph'); if (f) show(+f.dataset.i)} };

      // lightbox
      function show(i) {
        idx = (i + view.length) % view.length; const p = view[idx];
        $('im').onerror = () => {$('im').onerror = null; $('im').src = FB}; $('im').src = p.src; $('im').alt = p.caption || '';
        $('lc').textContent = p.caption || ''; $('ld').textContent = fmt(p.taken_on); $('dl').hidden = !p.own; $('lb').classList.add('open')
      }
      const step = d => show(idx + d), close = () => $('lb').classList.remove('open');
      $('x').onclick = close; $('pv').onclick = () => step(-1); $('nx').onclick = () => step(1);
      $('lb').onclick = e => {if (e.target.id === 'lb') close()};
      addEventListener('keydown', e => {if (!$('lb').classList.contains('open')) return; if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1)});
      let sx = 0; $('im').addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive: true});
      $('im').addEventListener('touchend', e => {const d = e.changedTouches[0].clientX - sx; if (Math.abs(d) > 50) step(d < 0 ? 1 : -1)});
      $('dl').onclick = async () => {
        const p = view[idx]; if (!p.own || !confirm('Delete this photo for good?')) return;
        await sb.storage.from('photos').remove([p.path]);
        const {error} = await sb.from('photos').delete().eq('id', p.id);
        if (error) return toast('Could not delete: ' + error.message);
        close(); toast('Photo deleted'); load()
      };

      // upload: drag and drop, resize in the browser, then store
      const drop = $('drop'), file = $('file');
      drop.onclick = () => file.click(); drop.onkeydown = e => {if (e.key === 'Enter') file.click()};
      drop.ondragover = e => {e.preventDefault(); drop.classList.add('on')}; drop.ondragleave = () => drop.classList.remove('on');
      drop.ondrop = e => {e.preventDefault(); drop.classList.remove('on'); upload([...e.dataTransfer.files])};
      file.onchange = () => upload([...file.files]);
      async function shrink(f) {
        const b = await createImageBitmap(f), k = Math.min(1, 1600 / Math.max(b.width, b.height)), c = document.createElement('canvas');
        c.width = Math.round(b.width * k); c.height = Math.round(b.height * k); c.getContext('2d').drawImage(b, 0, 0, c.width, c.height);
        return new Promise(r => c.toBlob(r, 'image/jpeg', .85))
      }
      async function upload(files) {
        files = files.filter(f => ['image/jpeg', 'image/png', 'image/webp'].includes(f.type) && f.size <= 10 * 1048576);
        if (!files.length) return toast('Choose jpg, png or webp images up to 10 MB.');
        const bar = $('bar'); bar.style.display = 'block'; let ok = 0;
        for (const [i, f] of files.entries()) {
          try {
            const blob = await shrink(f), path = me.user.id + '/' + crypto.randomUUID() + '.jpg';
            const u = await sb.storage.from('photos').upload(path, blob, {contentType: 'image/jpeg'});
            if (u.error) throw u.error;
            const r = await sb.from('photos').insert({path, caption: $('cap').value.trim() || null, taken_on: $('dt').value || null, category: $('cat').value});
            if (r.error) {await sb.storage.from('photos').remove([path]); throw r.error}
            ok++;
          } catch (e) {toast('Upload failed: ' + e.message)}
          bar.firstChild.style.width = ((i + 1) / files.length * 100) + '%';
        }
        setTimeout(() => {bar.style.display = 'none'; bar.firstChild.style.width = 0}, 700);
        file.value = ''; if (ok) {toast(ok + (ok > 1 ? ' photos' : ' photo') + ' added'); $('cap').value = ''; load()}
      }
      load();
    }
  </script>
</body>

</html>
